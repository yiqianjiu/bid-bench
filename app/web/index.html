<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投标业务工作台</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-title">投标业务工作台</div>
      <div class="brand-sub" id="companyHint">本地版</div>
    </div>
    <button class="btn primary block" id="btnNew">＋ 新建项目</button>
    <div class="nav-label">我的项目</div>
    <div id="projectList" class="project-list"></div>
    <div class="sidebar-foot">
      <button class="btn ghost block" id="btnArchived">查看已归档</button>
      <button class="btn ghost block" id="btnSettings">设置</button>
    </div>
  </aside>

  <main class="main" id="main">
    <div class="empty">
      <h2>欢迎使用投标业务工作台</h2>
      <p>左边点「＋ 新建项目」，把招标文件拖进来，就可以开始。</p>
      <p class="muted">所有项目都保存在工作台的数据目录里，下次双击「启动工作台」即可再次打开。</p>
    </div>
  </main>
</div>

<div class="modal-mask" id="modalMask">
  <div class="modal" id="modal"></div>
</div>
<div class="toast" id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
